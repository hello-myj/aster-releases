name: Publish static Aster distribution
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sdk_ref:
        description: SDK branch or commit
        default: feat/github-static-distribution
        required: true
      apps_ref:
        description: APPS branch or commit
        default: feat/github-static-distribution
        required: true
permissions:
  contents: write
concurrency:
  group: publish-static-channel
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: hello-myj/aster-sdk
          ref: ${{ inputs.sdk_ref || 'feat/github-static-distribution' }}
          path: build/aster-sdk
      - uses: actions/checkout@v4
        with:
          repository: hello-myj/aster-apps
          ref: ${{ inputs.apps_ref || 'feat/github-static-distribution' }}
          path: build/aster-apps
      - uses: actions/checkout@v4
        with:
          repository: hello-myj/aster-firmware
          ref: main
          path: build/aster-firmware
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: |
          python -m pip install -r build/aster-sdk/requirements.txt
          chmod +x build/aster-sdk/toolchain/wamrc build/aster-sdk/toolchain/binaryen/bin/wasm-opt
          chmod +x build/aster-sdk/toolchain/wasi-sdk-24.0-x86_64-linux/bin/*
      - name: Select immutable release tag
        run: echo "ASTER_TAG=public-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
      - name: Build, verify and export both hardware profiles
        run: |
          python build/aster-apps/tools/prepare-publication.py --tag "$ASTER_TAG" \
            --repository "$GITHUB_REPOSITORY" --output "build/assets-$ASTER_TAG" \
            --sdk build/aster-sdk --firmware build/aster-firmware
      - name: Upload draft and publish channel atomically
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python build/aster-sdk/tools/aster.py distribute publish --tag "$ASTER_TAG" \
            --repository "$GITHUB_REPOSITORY" --output "build/assets-$ASTER_TAG"
